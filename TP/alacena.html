<!DOCTYPE html>
<html lang="es">
<head>

    <title>Alacena</title>

</head>
<body>
    <div class="view-container">

        <div class="tabs">

            <a href="index.html" class="tab inactive" style="text-decoration: none; text-align: center;">Compras</a>

            <button class="tab active">Alacena</button>
        </div>

            <div class="notebook-line">

                <div class="item-actions">
                    <span>2</span>
                    <a href="editar.html" class="btn-editar" title="Editar">

                    </a>
                    <button class="btn-eliminar" title="Eliminar">

                    </button>
                </div>
            </div>

                <span class="item-name">Harina</span>

                        <i class="fa-solid fa-pencil"></i>                                
                    </a>
                    <button class="btn-eliminar" title="Eliminar">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>             
                </div>
            </div>
            <div class="notebook-line">

            </div>
            <div class="notebook-line">
                <span class="item-name">Acondicionador</span>
                <div class="item-actions">
                    <span>1</span>
                    <a href="editar.html" class="btn-editar" title="Editar">
                        <i class="fa-solid fa-pencil"></i>                                
                    </a>
                    <button class="btn-eliminar" title="Eliminar">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>               
                </div>
            </div>
            <div class="notebook-line"></div>
            <div class="notebook-line"></div>
            <div class="notebook-line"></div>
            <div class="notebook-line"></div>
        </div>


        <div class="barra-inferior">
            <a href="editar.html" class="btn-inferior" style="text-decoration: none;">
                <span>Nuevo Producto</span>
                <i class="fa-solid fa-plus"></i>
