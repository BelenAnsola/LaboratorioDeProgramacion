<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
            
            <!-- Vista de Edicion -->
    <div class="view-container edit-view">
        
        <h2 class="edit-title">Imagen Producto</h2>
        
        <div class="img-box">
            <button class="flecha_izquierda">❮</button>
            <img src="pantene.jpg">
            <button class="flecha_derecha">❯</button>
        </div>

        <div class="img-controls">
            <button class="btn-add-img">
                Nueva Imagen <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div class="form-group">
            <label>Producto</label>
            <input type="text" class="input-white" value="Shampoo">
        </div>

        <div class="form-group">
            <label>Tamaño paquete</label>
            <input type="number" class="input-white" value="400">
        </div>

        <div class="form-group">
            <label>Unidad de Medida</label>
            <div class="wrap-unidades">
                <select class="unidades">
                    <option value="unidad" selected>unidad</option>
                    <option value="ml">ml</option>
                    <option value="l">l</option>
                    <option value="g">g</option>
                    <option value="kg">kg</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Cantidad</label>
            <input type="number" class="input-white" value="1">
        </div>


    </div>
        <div class="btn-final">
            <button class="btn-eliminar" title="Eliminar">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <div class="btn-accion">
                <!-- El boton cancelar nos lleva de vuelta a la alacena -->
                <a href="alacena.html" class="btn-1" style="text-decoration:none; display:inline-block;">Cancelar</a>
                <a href="alacena.html" class="btn-2" style="text-decoration:none; display:inline-block;">Guardar</a>
            </div>
        </div>
</body>
</html>
